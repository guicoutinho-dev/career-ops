[project]
name = "australia-job-hunter"
version = "0.1.0"
description = "Australia Job Hunter: persistent, human-supervised, multi-agent job search and application pipeline"

requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pyyaml>=6.0",
    "python-jobspy>=1.1.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
